name: Keep schedule alive

# GitHub pauses scheduled checks after 60 days without commits.
# This makes a tiny commit on the 1st of each month.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .keepalive
          git config user.name "ticket-watch"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "Monthly keep-alive" && git push
